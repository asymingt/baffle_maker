name: Make a baffle!
on:
  push:
    branches:
      - main
  schedule:
    # 7AM PDT (UTC-7) every day. GitHub Actions cron is always UTC and
    # doesn't shift for daylight saving, so this runs at 6AM PST in winter.
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      publish_to_pages:
        description: 'Publish the result to pages'
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  call-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Cache Baffle Data
        uses: actions/cache@v4
        with:
          path: site
          key: baffle-site-cache-${{ github.run_id }}
          restore-keys: |
            baffle-site-cache-
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: false
          disk-cache: false
          repository-cache: false
      - name: Query GitHub for open pull requests (MODEL)
        env:
          GITHUB_API_TOKEN: ${{ secrets.WAFFLE_API_TOKEN }}
          USE_BAZEL_VERSION: 9.1.1
        run: |
          bazel run //baffle:query -- --force
      - name: Classify contributors (CONTROLLER)
        env:
          USE_BAZEL_VERSION: 9.1.1
        run: |
          bazel run //baffle:analyze
      - name: Render the baffle board (VIEW)
        env:
          USE_BAZEL_VERSION: 9.1.1
        run: |
          bazel run //baffle:render
      - name: Setup Pages
        if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.publish_to_pages == true
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.publish_to_pages == true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: call-api
    if: github.event_name == 'push' || github.event_name == 'schedule' || inputs.publish_to_pages == true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
